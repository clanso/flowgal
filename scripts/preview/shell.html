<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowGal · 预览（模拟 Tavern 页面）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: #0f1115; color: #e6e8ee; }
  .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
  .side { background: #15181e; border-right: 1px solid #23262e; display: flex; flex-direction: column; padding: 14px 10px; }
  .brand { font-weight: 700; letter-spacing: .08em; padding: 4px 10px 16px; color: #fff; }
  .brand small { display: block; font-weight: 400; color: #8b90a0; font-size: 11px; margin-top: 4px; }
  .chat-item { padding: 9px 10px; border-radius: 8px; background: #20242d; font-size: 13px; }
  .chat-item small { display: block; color: #8b90a0; margin-top: 2px; }
  .side-foot { margin-top: auto; border-top: 1px solid #23262e; padding-top: 8px; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .head { padding: 14px 24px; border-bottom: 1px solid #23262e; font-weight: 600; display: flex; gap: 10px; align-items: center; }
  .head small { color: #8b90a0; font-weight: 400; }
  .log { flex: 1; overflow: auto; padding: 18px 0 40px; }
  .msg { max-width: 760px; margin: 0 auto; padding: 10px 24px; }
  .msg.user { text-align: right; }
  .msg.user .bubble { display: inline-block; background: #2b3242; padding: 8px 14px; border-radius: 14px 14px 4px 14px; font-size: 14px; color: #cdd3e1; }
  .who { font-size: 12px; color: #8b90a0; margin-bottom: 6px; }
  .para { margin: 0 0 .7em; line-height: 1.85; font-size: 15px; }
  .actions { display: flex; gap: 6px; margin-top: 4px; }
  .actions button, .composer-actions button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 1px solid #2c313c; background: #1a1d24; color: #c6cbd8; cursor: pointer; }
  .actions button:hover, .composer-actions button:hover { background: #242833; }
  .composer { border-top: 1px solid #23262e; padding: 12px 24px 18px; }
  .composer-inner { max-width: 760px; margin: 0 auto; }
  .composer textarea { width: 100%; min-height: 56px; resize: none; border-radius: 12px; border: 1px solid #2c313c; background: #171a20; color: #e6e8ee; padding: 10px 12px; font: inherit; font-size: 14px; }
  .composer-actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .composer-actions .send { margin-left: auto; background: #3b6cff; border-color: #3b6cff; color: #fff; }
  .note { color: #6f7486; font-size: 11px; text-align: center; padding: 6px; }
  @media (max-width: 700px) { .app { grid-template-columns: 1fr; } .side { display: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script>
  // DSH 的浏览器插件加载器：插件以 window.__ModuleLoader__.load({ id, factory }) 自注册，React 由宿主提供。
  window.__plugins = [];
  window.__ModuleLoader__ = { load({ id, factory }) { window.__plugins.push({ id, mod: factory(name => (name === 'react' ? window.React : null)) }); } };
</script>
<script src="/client.js"></script>
<script src="/shell.js"></script>
</body>
</html>
